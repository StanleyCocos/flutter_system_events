name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter test
        working-directory: example

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: ./gradlew :flutter_system_events:testDebugUnitTest
        working-directory: example/android

      - run: flutter build apk --debug
        working-directory: example

  apple:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build ios --debug --simulator
        working-directory: example

      - run: flutter build macos --debug
        working-directory: example

      - run: xcodebuild test -workspace Runner.xcworkspace -scheme Runner -configuration Debug -destination platform=macOS
        working-directory: example/macos

      - run: flutter test integration_test/plugin_integration_test.dart -d macos
        working-directory: example

  publish-dry-run:
    runs-on: ubuntu-latest
    needs: [flutter, android, apple]

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub publish --dry-run
